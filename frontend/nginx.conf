server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reviewers can be up to 10 MB (the API enforces it too).
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The browser only talks to this origin. /api/* goes to the backend with the prefix removed,
    # so the API needs no CORS setup.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Built files have hashed names, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # nginx drops server-level add_header lines inside a location that sets its own, so the
    # security headers live in one snippet that every location includes.

    # Single-page app: any other path is a screen inside the app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
