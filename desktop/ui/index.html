<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CaseLens</title>
    <style>
      :root {
        --bg: oklch(0.975 0.008 90); --fg: oklch(0.22 0.03 255); --muted: oklch(0.45 0.03 255); --accent: oklch(0.6 0.1 85);
        --bar: oklch(0.28 0.065 255); --bar-fg: oklch(0.95 0.01 90); --bar-muted: oklch(0.84 0.06 245);
        --bar-hover: oklch(0.35 0.07 255); --bar-border: oklch(0.38 0.055 255); --gilt: oklch(0.83 0.1 85); --close: oklch(0.46 0.15 25);
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: oklch(0.21 0.03 255); --fg: oklch(0.93 0.01 90); --muted: oklch(0.78 0.03 255); --accent: oklch(0.83 0.1 85); --bar: oklch(0.27 0.06 255); }
      }
      html, body { height: 100%; margin: 0; }
      body { background: var(--bg); color: var(--fg); font: 17px/1.5 system-ui, sans-serif; display: grid; place-items: center; }
      main { max-width: 28rem; padding: 0 16px; text-align: center; }
      h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
      p { color: var(--muted); margin: 0; }
      .bar { margin: 1.5rem auto 0; width: 12rem; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--accent) 20%, transparent); overflow: hidden; }
      .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent); animation: slide 1.2s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
      .problem .bar { display: none; }
      /* The same title bar as the library page (DesktopTitleBar), so the window looks the same from the first second. */
      .titlebar { position: fixed; inset: 0 0 auto 0; height: 2.25rem; display: flex; align-items: center; background: var(--bar);
        color: var(--bar-fg); border-bottom: 1px solid var(--bar-border); user-select: none; -webkit-user-select: none; }
      .titlebar .name { display: flex; align-items: center; gap: .5rem; padding-left: 1rem; font-size: .875rem; font-weight: 600; flex: 1; height: 100%; }
      .mac .titlebar .name { padding-left: 5rem; }
      .titlebar svg { pointer-events: none; }
      .titlebar button { width: 3rem; height: 100%; border: 0; background: none; color: var(--bar-muted); display: grid; place-items: center; cursor: default; }
      .titlebar button:hover { background: var(--bar-hover); color: var(--bar-fg); }
      .titlebar button.close:hover { background: var(--close); }
      .mac .titlebar button { display: none; }
    </style>
  </head>
  <body>
    <div class="titlebar" data-tauri-drag-region>
      <div class="name" data-tauri-drag-region>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--gilt)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></svg>
      </div>
      <button type="button" data-action="minimize" aria-label="Minimize"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button type="button" data-action="toggleMaximize" aria-label="Maximize"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>
      <button type="button" data-action="close" class="close" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <main>
      <h1>CaseLens</h1>
      <p id="message">Opening your library…</p>
      <div class="bar" aria-hidden="true"></div>
    </main>
    <script>
      if (/Mac/i.test(navigator.userAgent)) document.documentElement.classList.add('mac')
      document.querySelectorAll('.titlebar button').forEach((button) =>
        button.addEventListener('click', () => window.__TAURI__.window.getCurrentWindow()[button.dataset.action]()),
      )
    </script>
  </body>
</html>
