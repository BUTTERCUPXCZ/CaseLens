# Builds the desktop installers: Windows (.exe), Mac Apple chip and Mac Intel (.dmg). No paid signing: Mac builds are ad-hoc
# signed, Windows is unsigned (see desktop/INSTALL.md for the first-open steps).
#   - Actions tab > "Desktop app" > Run workflow: builds the installers (download them from the run's page).
#   - Push a tag like v1.0.0: builds them and publishes a GitHub Release with the three installers attached.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read # only the release step may write (it publishes the installers)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest # Apple chip (M1 and newer)
            bundles: app,dmg
          - os: macos-15-intel # Intel Mac
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Third-party steps pinned to exact commits, so a changed tag cannot slip new code into the build.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri

      - name: Screens
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend program
        working-directory: backend
        run: |
          python -m pip install -r requirements-desktop.txt
          python -m PyInstaller caselens.spec --noconfirm

      - name: Desktop app
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: CaseLens-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" installers/* \
            --repo "$REPO" \
            --title "CaseLens $TAG" \
            --notes "Windows: CaseLens_*_x64-setup.exe. Mac with Apple chip (M1 or newer): CaseLens_*_aarch64.dmg. Intel Mac: CaseLens_*_x64.dmg. First time opening: see desktop/INSTALL.md."
