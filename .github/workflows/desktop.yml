# Builds the desktop installer for Windows (.exe); Mac builds are ready to switch back on in the matrix. No paid signing: Mac
# builds would be ad-hoc signed, Windows is unsigned (see desktop/INSTALL.md for the first-open steps). Updates are signed with CaseLens's own update
# key (repo secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD); installed apps refuse anything else.
# Each build gathers its files under clear names; the publish step attaches them all and writes latest.json.
#   - Actions tab > "Desktop app" > Run workflow: builds the installers (download them from the run's page).
#   - Push a tag like v1.2.0 (= the version in desktop/src-tauri/tauri.conf.json, set with desktop/scripts/version.mjs):
#     publishes a GitHub Release with the installers, the signed update files and latest.json, which installed apps read to
#     update themselves. The tag's message is the release notes shown in the app's update bar.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    # A tag run: check the version, then create the release once, before the three builds add their files to it.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the app's version
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG but the app says $version: run 'node desktop/scripts/version.mjs ${TAG#v}', commit, and tag again." >&2
            exit 1
          fi
      - name: Create the release (notes = the tag's message)
        id: create
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > notes.txt
          gh release create "$TAG" --repo "$REPO" --title "CaseLens $TAG" --notes-file notes.txt --draft
          echo "id=$(gh api "repos/$REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    if: ${{ !failure() && !cancelled() }} # also runs on a manual run, where there is no release job
    permissions:
      contents: read # only gathers files; the publish job attaches them
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest # the client uses Windows
            bundles: nsis
          # For a Mac build later, add these back (the steps below already handle Macs):
          #   - os: macos-latest      # Apple chip (M1 and newer)
          #     bundles: app,dmg
          #   - os: macos-15-intel    # Intel Mac
          #     bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Third-party steps pinned to exact commits, so a changed tag cannot slip new code into the build.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri

      - name: Screens
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend program
        working-directory: backend
        run: |
          python -m pip install -r requirements-desktop.txt
          python -m PyInstaller caselens.spec --noconfirm

      - name: Desktop app (signs the update files when the signing secrets are set)
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::No update signing secrets: installers only, installed apps cannot update to this build."
            npx tauri build --bundles ${{ matrix.bundles }}
          fi

      - name: Gather the files to publish
        shell: bash
        run: |
          mkdir out
          bundle=desktop/src-tauri/target/release/bundle
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$bundle"/nsis/*-setup.exe out/
            if ls "$bundle"/nsis/*-setup.exe.sig >/dev/null 2>&1; then
              exe=$(basename "$(ls "$bundle"/nsis/*-setup.exe)")
              cp "$bundle"/nsis/*-setup.exe.sig out/
              printf '{"platform":"windows-x86_64","file":"%s"}' "$exe" > out/update-windows-x86_64.json
            fi
          else
            arch=$([ "$(uname -m)" = "arm64" ] && echo aarch64 || echo x64)
            platform=$([ "$arch" = "aarch64" ] && echo darwin-aarch64 || echo darwin-x86_64)
            cp "$bundle"/dmg/*.dmg out/
            if [ -f "$bundle"/macos/CaseLens.app.tar.gz.sig ]; then
              # Both Macs make "CaseLens.app.tar.gz": give each its own name.
              cp "$bundle"/macos/CaseLens.app.tar.gz "out/CaseLens_${arch}.app.tar.gz"
              cp "$bundle"/macos/CaseLens.app.tar.gz.sig "out/CaseLens_${arch}.app.tar.gz.sig"
              printf '{"platform":"%s","file":"CaseLens_%s.app.tar.gz"}' "$platform" "$arch" > "out/update-${platform}.json"
            fi
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: CaseLens-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  publish:
    # All three built: attach the files, write latest.json (what installed apps read to update), make the release public.
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Write latest.json from the signed update files
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          notes = subprocess.run(["gh", "release", "view", tag, "--repo", repo, "--json", "body", "--jq", ".body"], capture_output=True, text=True).stdout.strip()
          platforms = {}
          for piece in glob.glob("out/update-*.json"):
              entry = json.load(open(piece))
              signature = open(f"out/{entry['file']}.sig").read().strip()
              platforms[entry["platform"]] = {"signature": signature, "url": f"https://github.com/{repo}/releases/download/{tag}/{entry['file']}"}
              os.remove(piece)
          if platforms:
              json.dump({"version": tag.lstrip("v"), "notes": notes, "pub_date": subprocess.run(["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"], capture_output=True, text=True).stdout.strip(), "platforms": platforms}, open("out/latest.json", "w"), indent=2)
              print("latest.json for", sorted(platforms))
          else:
              print("::warning::No signed update files: this release cannot be installed by the app's updater.")
          PY
          ls -la out
      - name: Attach the files and publish
        run: |
          gh release upload "$TAG" out/* --repo "$REPO" --clobber
          gh release edit "$TAG" --repo "$REPO" --draft=false --latest
