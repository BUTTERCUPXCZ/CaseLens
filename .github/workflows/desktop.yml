# Builds the desktop installers: Windows (.exe), Mac Apple chip and Mac Intel (.dmg). No paid signing: Mac builds are ad-hoc
# signed, Windows is unsigned (see desktop/INSTALL.md for the first-open steps). Updates are signed with CaseLens's own update
# key (repo secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD); installed apps refuse anything else.
#   - Actions tab > "Desktop app" > Run workflow: builds the installers (download them from the run's page).
#   - Push a tag like v1.2.0 (= the version in desktop/src-tauri/tauri.conf.json, set with desktop/scripts/version.mjs):
#     publishes a GitHub Release with the installers, the signed update files and latest.json, which installed apps read to
#     update themselves. The tag's message is the release notes shown in the app's update bar.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    # A tag run: check the version, then create the release once, before the three builds add their files to it.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the app's version
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG but the app says $version: run 'node desktop/scripts/version.mjs ${TAG#v}', commit, and tag again." >&2
            exit 1
          fi
      - name: Create the release (notes = the tag's message)
        id: create
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > notes.txt
          gh release create "$TAG" --repo "$REPO" --title "CaseLens $TAG" --notes-file notes.txt --draft
          echo "id=$(gh api "repos/$REPO/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    if: ${{ !failure() && !cancelled() }} # also runs on a manual run, where there is no release job
    permissions:
      contents: write # adds the installers to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest # Apple chip (M1 and newer)
            bundles: app,dmg
          - os: macos-15-intel # Intel Mac
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Third-party steps pinned to exact commits, so a changed tag cannot slip new code into the build.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri

      - name: Screens
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend program
        working-directory: backend
        run: |
          python -m pip install -r requirements-desktop.txt
          python -m PyInstaller caselens.spec --noconfirm

      - name: Desktop tools
        working-directory: desktop
        run: npm ci

      - name: Build, sign the update files, add them to the release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          # Signed update files only when the signing secrets are set; without them the installers are still built.
          args: --bundles ${{ matrix.bundles }} ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config {"bundle":{"createUpdaterArtifacts":true}}' || '' }}
          releaseId: ${{ needs.release.outputs.id }}
          includeUpdaterJson: true

      - uses: actions/upload-artifact@v4
        with:
          name: CaseLens-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    # All three built: make the release public. Only now does latest.json point installed apps at the new version.
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release edit "$TAG" --repo "$REPO" --draft=false --latest
