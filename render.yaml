# Render Blueprint: the API on the free plan. The jobs run inside it as threads (no workers, no RabbitMQ).
# The database is Supabase: paste its Session pooler address as DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: caselens-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: QUEUE_BACKEND
        value: threads
      - key: DIGEST_AI_DAILY_LIMIT
        value: "20"
      - key: UPLOAD_MAX_MB
        value: "5"
      - key: UPLOAD_KEEP_DAYS
        value: "7"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: LAWPHIL_USER_AGENT
        sync: false
